<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstimateAI | Intelligence-Driven Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-grid: rgba(99, 102, 241, 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Tech Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(var(--bg-grid) 2px, transparent 2px),
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 50px 50px, 100px 100px, 100px 100px;
            z-index: -2;
        }

        /* Floating Bokeh Animation */
        .bokeh {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.07) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(60px);
            animation: float 20s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translate(-10%, -10%) scale(1);
            }

            100% {
                transform: translate(20%, 30%) scale(1.2);
            }
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .sidebar-closed #sidebar {
            transform: translateX(-100%);
        }

        .sidebar-closed main {
            margin-left: 0 !important;
        }

        #sidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        /* Banner Pulse */
        .pro-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            position: relative;
            overflow: hidden;
        }

        .status-pill {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .custom-input:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
            outline: none;
        }

        .hidden-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .show-section {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
  </head>
  <body class="sidebar-closed">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
      <script>
    function toggleDetails(id) {
        const section = document.getElementById(id);
        const icon = event.currentTarget.querySelector('i');
        
        section.classList.toggle('hidden');
        
        if (!section.classList.contains('hidden')) {
            icon.style.transform = 'rotate(180deg)';
        } else {
            icon.style.transform = 'rotate(0deg)';
        }
    }
</script>
<script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-closed');
        }

        function updateFileStatus(input) {
            const display = document.getElementById('file-name-display');
            if (input.files && input.files[0]) {
                display.innerText = "STAGED: " + input.files[0].name;
                display.classList.remove('hidden');
            }
        }

        function triggerAnalysis() {
            const overlay = document.getElementById('analysis-overlay');
            const uploadStage = document.getElementById('upload-stage');
            const results = document.getElementById('analysis-results');

            overlay.classList.remove('hidden');

            setTimeout(() => {
                overlay.classList.add('hidden');
                uploadStage.classList.add('hidden');
                results.classList.add('show-section');
                results.scrollIntoView({ behavior: 'smooth' });
            }, 3000);
        }
    </script>
  </body>
  
</html>
